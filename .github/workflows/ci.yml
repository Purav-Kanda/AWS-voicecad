# Runs from the voicecad repo root. guided-intake is installed from its own repo.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: pip install "guided-intake @ git+https://github.com/Purav-Kanda/guided-intake.git"
      - run: pip install -e ".[dev]" ruff mypy
      - run: ruff check .
      - run: mypy
      - run: pytest -q
